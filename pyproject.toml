[project]
name = "horizon"
version = "0.1.0"
description = "Horizon — pesquisas da consultora, nota do funcionário e painel do órgão"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "fastapi>=0.115",
    "passlib[argon2]>=1.7",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
