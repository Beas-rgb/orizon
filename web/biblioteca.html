<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — biblioteca</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body class="painel">
    <header class="topo">
      <a class="marca" href="painel.html">
        <span class="selo">OR</span>
        <div>Horizon<small>Biblioteca</small></div>
      </a>
      <p class="conta">
        <span id="quem"></span>
        <button type="button" id="sair">Sair</button>
      </p>
    </header>

    <main class="principal" style="max-width: 48rem; margin: 1.5rem auto; padding: 0 1rem">
      <section class="cartao">
        <h1>Biblioteca principal</h1>
        <p class="nota">
          Só a consultora. Arquivos-modelo. Sem audiência ficam PRIVADOS. Órgão e
          funcionário nunca veem esta camada. A visibilidade é decidida no
          backend — conhecer o ID não libera o download.
        </p>
        <p id="aviso" class="aviso-form"></p>
        <form id="form-envio">
          <label>Arquivo
            <input name="arquivo" type="file" required />
          </label>
          <button class="acao" type="submit">Enviar para a principal</button>
        </form>
        <h2>Arquivos</h2>
        <ul class="lista" id="lista"></ul>
        <form id="form-copiar" hidden>
          <h2>Enviar cópia para um trabalho</h2>
          <input type="hidden" name="documento_id" id="doc-copiar" />
          <label>Trabalho
            <select name="projeto_id" id="projetos" required></select>
          </label>
          <button class="acao" type="submit">Copiar (continua privado no projeto)</button>
        </form>
      </section>
      <p><a href="painel.html">Voltar ao painel</a></p>
    </main>
    <script src="horizon.js"></script>
    <script>
      const avisoEl = document.getElementById("aviso");
      function aviso(texto) {
        avisoEl.textContent = texto;
      }

      function rotuloVisibilidade(valor) {
        return (
          {
            PRIVADO: "só a consultora",
            ORGAO: "ela + órgão",
            FUNCIONARIOS: "ela + funcionários",
            PUBLICO_PROJETO: "todos do projeto",
          }[valor] || valor
        );
      }

      async function carregarLista() {
        const lista = document.getElementById("lista");
        lista.replaceChildren();
        const docs = await api("/biblioteca");
        const principais = docs.filter((item) => item.camada === "PRINCIPAL");
        if (!principais.length) {
          lista.textContent = "Nenhum arquivo na biblioteca principal.";
          return;
        }
        principais.forEach((item) => {
          const li = document.createElement("li");
          const texto = document.createElement("p");
          texto.textContent =
            item.nome +
            " — " +
            item.camada +
            " — " +
            rotuloVisibilidade(item.visibilidade) +
            " — " +
            item.tamanho +
            " bytes";
          const baixar = document.createElement("button");
          baixar.type = "button";
          baixar.textContent = "Baixar";
          baixar.addEventListener("click", async () => {
            aviso("");
            try {
              await baixarArquivo(item.id, item.nome);
            } catch (exc) {
              aviso(exc.message);
            }
          });
          const copiar = document.createElement("button");
          copiar.type = "button";
          copiar.textContent = "Enviar a um trabalho";
          copiar.addEventListener("click", () => {
            document.getElementById("doc-copiar").value = item.id;
            document.getElementById("form-copiar").hidden = false;
          });
          li.append(texto, baixar, copiar);
          lista.appendChild(li);
        });
      }

      async function carregarProjetos() {
        const select = document.getElementById("projetos");
        select.replaceChildren();
        const projetos = await api("/projetos");
        projetos.forEach((item) => {
          const op = document.createElement("option");
          op.value = item.id;
          op.textContent = item.vinculo_titulo + " — " + item.razao_social;
          select.appendChild(op);
        });
      }

      document.getElementById("sair").addEventListener("click", sair);

      document.getElementById("form-envio").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        aviso("");
        const arquivo = evento.currentTarget.arquivo.files[0];
        if (!arquivo) return;
        const dados = new FormData();
        dados.append("arquivo", arquivo);
        try {
          await apiArquivo("/biblioteca", dados);
          evento.currentTarget.reset();
          await carregarLista();
          aviso("Arquivo enviado. Sem audiência: fica só com você.");
        } catch (exc) {
          aviso(exc.message);
        }
      });

      document.getElementById("form-copiar").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        aviso("");
        const form = evento.currentTarget;
        try {
          await api("/biblioteca/" + form.documento_id.value + "/enviar", {
            method: "POST",
            json: { projeto_id: form.projeto_id.value },
          });
          form.hidden = true;
          aviso("Cópia enviada ao trabalho. Continua PRIVADA lá.");
        } catch (exc) {
          aviso(exc.message);
        }
      });

      api("/auth/eu")
        .then(async (eu) => {
          if (eu.painel !== "consultora") {
            irParaPainel(eu.painel);
            return;
          }
          document.getElementById("quem").textContent = eu.nome;
          await carregarProjetos();
          await carregarLista();
        })
        .catch(() => {
          window.location.href = "entrar.html";
        });
    </script>
  </body>
</html>
