<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — cadastro da consultora</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <main>
      <p class="olho">Tela de teste</p>
      <h1>Pedir conta de consultora</h1>
      <p class="nota">
        Informe nome e e-mail. A conta não nasce agora: o pedido fica pendente
        por no máximo 5 dias, até a autorização. A senha você cria depois, no
        link que chega no e-mail.
      </p>
      <form id="cadastro">
        <label>Nome<input name="nome" required minlength="2" /></label>
        <label>E-mail<input name="email" type="email" required /></label>
        <button type="submit">Enviar pedido</button>
        <p id="erro" class="erro"></p>
        <p id="ok" class="nota"></p>
      </form>
      <p><a href="index.html">Voltar</a></p>
    </main>
    <script src="horizon.js"></script>
    <script>
      document.getElementById("cadastro").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const form = evento.currentTarget;
        const erro = document.getElementById("erro");
        const ok = document.getElementById("ok");
        erro.textContent = "";
        ok.textContent = "";
        try {
          const dados = await api("/auth/cadastro-consultora", {
            method: "POST",
            json: {
              nome: form.nome.value,
              email: form.email.value,
            },
          });
          ok.textContent = dados.mensagem;
          form.reset();
        } catch (exc) {
          erro.textContent = exc.message;
        }
      });
    </script>
  </body>
</html>
