<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — primeiro acesso</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <main>
      <h1>Defina sua senha</h1>
      <p class="nota">A senha não veio no e-mail. Você cria agora.</p>
      <form id="ativar">
        <label>Senha<input name="senha" type="password" minlength="8" required /></label>
        <button type="submit">Entrar no Horizon</button>
        <p id="erro" class="erro"></p>
      </form>
    </main>
    <script src="horizon.js"></script>
    <script>
      const token = tokenDoLink();
      document.getElementById("ativar").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const erro = document.getElementById("erro");
        erro.textContent = "";
        if (!token) {
          erro.textContent = "Abra o link que chegou no e-mail.";
          return;
        }
        try {
          const dados = await api("/auth/primeiro-acesso", {
            method: "POST",
            json: { token, senha: evento.currentTarget.senha.value },
          });
          guardarSessao(dados);
          window.location.href = dados.painel === "consultora" ? "painel.html" : "index.html";
        } catch (exc) {
          erro.textContent = exc.message;
        }
      });
    </script>
  </body>
</html>
