<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — funcionário</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body class="painel-papel">
    <main>
      <header class="topo-simples">
        <div>
          <p class="olho">Tela de teste</p>
          <h1>Painel do funcionário</h1>
          <p class="nota" id="quem"></p>
        </div>
        <button type="button" id="sair">Sair</button>
      </header>
      <p class="nota">
        Você responde pelo <strong>link da pesquisa</strong> (e-mail ou
        copiado pela consultora). Este painel só confirma em quais
        trabalhos você está. Não cria projeto e não vê a equipe.
      </p>
      <section class="cartao">
        <h2>Meus trabalhos</h2>
        <ul class="lista" id="lista"></ul>
      </section>
      <section class="cartao">
        <h2>Abrir link de resposta</h2>
        <p class="sub">Cole o token ou o link completo que você recebeu.</p>
        <form id="form-token">
          <label>Token ou link
            <input name="token" required placeholder="cole aqui" />
          </label>
          <button class="acao" type="submit">Abrir formulário</button>
        </form>
      </section>
      <p id="erro" class="erro"></p>
    </main>
    <script src="horizon.js"></script>
    <script>
      document.getElementById("sair").addEventListener("click", sair);

      document.getElementById("form-token").addEventListener("submit", (evento) => {
        evento.preventDefault();
        const bruto = new FormData(evento.target).get("token").trim();
        let token = bruto;
        try {
          if (bruto.includes("responder")) {
            const url = new URL(bruto, window.location.origin);
            token = decodeURIComponent(url.hash.replace(/^#/, "")) || token;
          } else if (bruto.includes("#")) {
            token = decodeURIComponent(bruto.split("#").pop());
          }
        } catch (_) {
          /* mantém o texto cru */
        }
        window.location.href = "responder.html#" + encodeURIComponent(token);
      });

      api("/auth/eu")
        .then((eu) => {
          if (eu.painel !== "funcionario") {
            irParaPainel(eu.painel);
            return null;
          }
          sessionStorage.setItem("horizon_painel", "funcionario");
          document.getElementById("quem").textContent = `${eu.nome} — ${eu.email}`;
          return api("/projetos");
        })
        .then((projetos) => {
          if (!projetos) return;
          const lista = document.getElementById("lista");
          lista.replaceChildren();
          if (!projetos.length) {
            lista.textContent =
              "Nenhum trabalho vinculado. Use o link da pesquisa quando ele chegar.";
            return;
          }
          projetos.forEach((item) => {
            const li = document.createElement("li");
            li.textContent =
              (item.vinculo_titulo || "Trabalho") +
              " — " +
              (item.razao_social || "") +
              " — " +
              (item.estado || "");
            lista.appendChild(li);
          });
        })
        .catch(() => {
          sessionStorage.clear();
          window.location.href = "entrar.html";
        });
    </script>
  </body>
</html>
