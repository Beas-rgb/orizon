<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — responder pesquisa</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <main>
      <p class="olho">Tela de teste</p>
      <h1>Responder pesquisa</h1>
      <p class="nota">
        Este link é anônimo. Não peça login. Em clima, sua identidade não é
        mostrada. O link só funciona uma vez.
      </p>
      <p id="erro" class="erro"></p>
      <p id="ok" class="nota" hidden></p>
      <form id="formulario" class="cartao" hidden></form>
    </main>
    <script src="horizon.js"></script>
    <script>
      const erro = document.getElementById("erro");
      const ok = document.getElementById("ok");
      const form = document.getElementById("formulario");
      const token = tokenDoLink();
      let perguntas = [];

      function campoPergunta(item) {
        const bloco = document.createElement("fieldset");
        bloco.className = "pergunta";
        const legenda = document.createElement("legend");
        legenda.textContent = item.texto + (item.obrigatoria ? " *" : "");
        bloco.appendChild(legenda);

        if (item.tipo === "TEXTO_LIVRE") {
          const area = document.createElement("textarea");
          area.name = item.id;
          area.rows = 3;
          if (item.obrigatoria) area.required = true;
          bloco.appendChild(area);
          return bloco;
        }

        if (item.tipo === "NOTA_5" || item.tipo === "NOTA_10") {
          const teto = item.tipo === "NOTA_5" ? 5 : 10;
          const select = document.createElement("select");
          select.name = item.id;
          if (item.obrigatoria) select.required = true;
          const vazio = document.createElement("option");
          vazio.value = "";
          vazio.textContent = "Escolha";
          select.appendChild(vazio);
          for (let n = 1; n <= teto; n += 1) {
            const op = document.createElement("option");
            op.value = String(n);
            op.textContent = String(n);
            select.appendChild(op);
          }
          bloco.appendChild(select);
          return bloco;
        }

        const opcoes = item.opcoes || [];
        opcoes.forEach((opcao) => {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = item.tipo === "CHECKBOX" ? "checkbox" : "radio";
          input.name = item.id;
          input.value = opcao.id;
          if (item.obrigatoria && item.tipo !== "CHECKBOX") input.required = true;
          label.append(input, document.createTextNode(" " + opcao.texto));
          bloco.appendChild(label);
        });
        return bloco;
      }

      function montarRespostas() {
        const respostas = [];
        for (const item of perguntas) {
          if (item.tipo === "TEXTO_LIVRE") {
            const campo = form.elements.namedItem(item.id);
            respostas.push({
              pergunta_id: item.id,
              valor_texto: campo ? campo.value : "",
            });
            continue;
          }
          if (item.tipo === "NOTA_5" || item.tipo === "NOTA_10") {
            const campo = form.elements.namedItem(item.id);
            const valor = campo && campo.value ? Number(campo.value) : null;
            respostas.push({
              pergunta_id: item.id,
              valor_numerico: valor,
            });
            continue;
          }
          if (item.tipo === "CHECKBOX") {
            const marcadas = form.querySelectorAll(
              `input[name="${item.id}"]:checked`
            );
            if (!marcadas.length) {
              respostas.push({ pergunta_id: item.id, opcao_id: null });
            } else {
              marcadas.forEach((input) => {
                respostas.push({
                  pergunta_id: item.id,
                  opcao_id: input.value,
                });
              });
            }
            continue;
          }
          const marcada = form.querySelector(`input[name="${item.id}"]:checked`);
          respostas.push({
            pergunta_id: item.id,
            opcao_id: marcada ? marcada.value : null,
          });
        }
        return respostas;
      }

      async function carregar() {
        if (!token) {
          erro.textContent = "Abra o link completo que a consultora enviou.";
          return;
        }
        try {
          perguntas = await api("/responder/" + encodeURIComponent(token), {
            publico: true,
          });
          form.replaceChildren();
          perguntas.forEach((item) => form.appendChild(campoPergunta(item)));
          const botao = document.createElement("button");
          botao.type = "submit";
          botao.textContent = "Enviar respostas";
          form.appendChild(botao);
          form.hidden = false;
        } catch (exc) {
          erro.textContent = exc.message;
        }
      }

      form.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        erro.textContent = "";
        ok.hidden = true;
        try {
          const saida = await api("/responder/" + encodeURIComponent(token), {
            method: "POST",
            publico: true,
            json: { respostas: montarRespostas() },
          });
          form.hidden = true;
          ok.hidden = false;
          if (saida.tipo === "DESEMPENHO" && saida.nota != null) {
            ok.textContent = saida.mensagem + " Sua nota: " + saida.nota + ".";
          } else {
            ok.textContent = saida.mensagem;
          }
          history.replaceState(null, "", "responder.html");
        } catch (exc) {
          erro.textContent = exc.message;
        }
      });

      carregar();
    </script>
  </body>
</html>
