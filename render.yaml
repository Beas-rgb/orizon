# Teste grátis. Segredos não entram aqui: preencha no painel do Render.
services:
  - type: web
    name: orizon-api
    runtime: docker
    plan: free
    branch: master
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # E-mail (Mailtrap preferido). Preencha no painel do Render — nunca no git.
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAILTRAP_FROM_EMAIL
        sync: false
      - key: MAILTRAP_FROM_NAME
        value: Horizon
      # Conta TI (bootstrap). Só hash no banco; valores no painel do Render.
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      # Cloudflare R2 (storage). Preencha no painel — nunca no git.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
