# Teste grátis. Segredos não entram aqui: preencha no painel do Render.
services:
  - type: web
    name: orizon-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
